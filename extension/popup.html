<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Tracker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      line-height: 1.5;
      width: 320px;
      color: #1f1f1f;
      background: #fff;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      border-bottom: 1px solid #e9e9e7;
    }
    .header-icon { font-size: 18px; }
    .header-text { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
    .header-sub  { font-size: 11px; color: #9b9b9b; margin-left: auto; }

    .body { padding: 14px 16px; }

    /* Not-Workday state */
    .idle {
      padding: 24px 16px;
      text-align: center;
      color: #9b9b9b;
      font-size: 12.5px;
      line-height: 1.7;
    }
    .idle strong { display: block; color: #1f1f1f; font-size: 13px; margin-bottom: 4px; }

    /* Status boxes */
    .box {
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 12.5px;
      line-height: 1.6;
      margin-bottom: 12px;
    }
    .box-info    { background: #f7f6f3; color: #555; }
    .box-error   { background: #fee2e2; color: #991b1b; }
    .box-success { background: #d1fae5; color: #065f46; }

    /* Job preview card */
    .card {
      border: 1px solid #e9e9e7;
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 14px;
    }
    .card-company { font-size: 11px; color: #9b9b9b; margin-bottom: 3px; }
    .card-title   { font-size: 14px; font-weight: 600; margin-bottom: 4px; line-height: 1.3; }
    .card-meta    { font-size: 11px; color: #6b7280; }
    .card-meta span::before { content: " · "; }
    .card-meta span:first-child::before { content: ""; }

    /* Send button */
    .btn {
      width: 100%;
      height: 36px;
      background: #2d7ef7;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s;
    }
    .btn:hover:not(:disabled) { background: #1a6de3; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .spinner {
      width: 12px;
      height: 12px;
      border: 2px solid rgba(255,255,255,.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="header">
    <span class="header-icon">📋</span>
    <span class="header-text">Job Tracker</span>
    <span class="header-sub" id="header-sub">Job Tracker</span>
  </div>
  <div id="root"></div>
  <script src="popup.js"></script>
</body>
</html>
